name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run tests
        run: node --test
      - name: Upload sample artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-tile-bbox
          path: samples/tile-bbox.json
